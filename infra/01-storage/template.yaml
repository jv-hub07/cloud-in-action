# =============================================================================
# STACK 1: "Hello, Cloud Storage"
# =============================================================================
#
# WHAT THIS TEMPLATE DOES:
#   Creates an Amazon S3 bucket configured as a static website host.
#   You upload an HTML file once, and the whole world can visit it —
#   no servers, no maintenance, no surprise bills.
#
# WHAT YOU WILL LEARN:
#   1. What a CloudFormation Template is (a recipe for cloud resources)
#   2. What Amazon S3 is (cloud object storage — like a USB drive in the sky)
#   3. What "Parameters" and "Outputs" are in CloudFormation
#   4. What "deploying a stack" means
#
# FREE TIER: S3 gives you 5 GB storage + 20,000 GET requests FREE per month.
#            This demo will cost exactly $0.00.
#
# HOW TO DEPLOY (from your terminal):
#   aws cloudformation deploy \
#     --template-file infra/01-storage/template.yaml \
#     --stack-name cloud-in-action-storage \
#     --parameter-overrides ProjectName=cloud-in-action Environment=dev
#
# =============================================================================

# AWSTemplateFormatVersion tells CloudFormation which version of the
# template language to use. Always use "2010-09-09" — it's the only
# supported version and has been stable for over a decade.
AWSTemplateFormatVersion: "2010-09-09"

# Description appears in the AWS Console so you know
# what this stack does without reading the whole template.
Description: >
  Stack 1 of 3 — "Hello, I am a Cloud Storage"
  Creates an S3 bucket configured as a static website.
  Part of the cloud-in-action demo repository.
  FREE TIER: $0.00 cost at demo scale.

# =============================================================================
# PARAMETERS — inputs you provide when deploying the stack
# Think of these like variables in a recipe:
# "How many cups of flour?" → you decide at bake time.
# =============================================================================
Parameters:

  # ProjectName is used to build a unique bucket name.
  # S3 bucket names must be GLOBALLY unique across ALL AWS accounts worldwide.
  ProjectName:
    Type: String
    Default: cloud-in-action
    Description: >
      A short name for your project. Used to name the S3 bucket.
      Must be lowercase letters, numbers, and hyphens only.
    # AllowedPattern restricts what values are valid — input validation in IaC!
    AllowedPattern: "[a-z0-9-]+"
    ConstraintDescription: "Must be lowercase letters, numbers, and hyphens only."
    MinLength: 3
    MaxLength: 40

  # Environment lets you deploy separate stacks for dev, qa, and prod
  # from the SAME template — just change this parameter.
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev       # Development — safe to experiment
      - qa   # Pre-production — testing before release
      - prod      # Production — real users, be careful!
    Description: >
      Deployment environment. Controls resource naming so you can have
      separate dev and prod buckets from the same template.

# =============================================================================
# RESOURCES — the actual AWS infrastructure to create
# This is the heart of the template. Each entry here = one AWS resource
# that CloudFormation will create, update, or delete on your behalf.
# =============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # THE S3 BUCKET
  # Amazon S3 (Simple Storage Service) stores files — called "objects" —
  # inside containers called "buckets". A bucket is like a folder in the cloud
  # that never gets full and never gets lost.
  # ---------------------------------------------------------------------------
  WebsiteBucket:
    # Type tells CloudFormation WHAT to create.
    # AWS::S3::Bucket means "create an S3 storage bucket".
    Type: AWS::S3::Bucket

    # DeletionPolicy: what happens when you DELETE this stack?
    # "Delete" = delete the bucket too (why? ~ no leftover charges)
    # "Retain" = keep the bucket even after stack deletion 
    DeletionPolicy: Delete

    Properties:
      # BucketName: we combine ProjectName + Environment to make it unique.
      # !Sub is CloudFormation's string interpolation — like f-strings in Python.
      # ${ProjectName} is replaced with the parameter value at deploy time.
      BucketName: !Sub "${ProjectName}-website-${Environment}-${AWS::AccountId}"
      #                                                           ^^^^^^^^^^^^^^^
      # Including the AWS Account ID guarantees global uniqueness —
      # no two accounts have the same ID.

      # WebsiteConfiguration turns this storage bucket into a web server.
      # S3 will serve IndexDocument when someone visits the bucket URL.
      WebsiteConfiguration:
        IndexDocument: index.html   # Serve this file at the root URL
        ErrorDocument: error.html   # Serve this file on 404 errors

      # SECURITY NOTE: For a public static website, we MUST allow public access.
      # S3 blocks all public access by default (good!).
      # We override that here ONLY because this bucket IS meant to be public.
      # In production: never disable block public access unless you need to.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false          # Allow public ACLs (needed for website)
        BlockPublicPolicy: false        # Allow public bucket policies
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

      # Tags are labels you attach to AWS resources for tracking costs,
      # searching, and organizing. Think of them like sticky notes on hardware.
      Tags:
        - Key: Project
          Value: !Ref ProjectName        # !Ref reads a Parameter or Resource ID
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation          # Always tag IaC-managed resources!
        - Key: Stack
          Value: "01-storage"

  # ---------------------------------------------------------------------------
  # THE BUCKET POLICY
  # A Bucket Policy is a JSON document that says WHO can do WHAT with the bucket.
  # This one says: "Anyone on the internet can READ files from this bucket."
  # Without this policy, the website would return 403 Forbidden to visitors.
  # ---------------------------------------------------------------------------
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      # Bucket: which bucket does this policy apply to?
      # !Ref WebsiteBucket returns the name of the bucket we created above.
      Bucket: !Ref WebsiteBucket

      PolicyDocument:
        Version: "2012-10-17"   # IAM policy language version — always use this
        Statement:
          - Sid: PublicReadGetObject   # Sid = Statement ID, a human-readable label
            Effect: Allow              # Allow (not Deny) the action below
            Principal: "*"             # "*" means EVERYONE (the public internet)
            Action: s3:GetObject       # GetObject = read/download a file
            Resource: !Sub "arn:aws:s3:::${WebsiteBucket}/*"
            #               ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
            # ARN = Amazon Resource Name — the unique identifier for any AWS resource.
            # The /* at the end means "all objects inside the bucket".

  # ---------------------------------------------------------------------------
  # THE WELCOME PAGE (uploaded inline via CloudFormation)
  # We use a Custom Resource backed by a Lambda to upload index.html.
  # This is the "magic" — one template deploy creates the bucket AND
  # puts content in it.
  # ---------------------------------------------------------------------------
  # NOTE: For simplicity in this demo, we output the bucket URL and instruct
  # the learner to upload index.html manually OR via the deploy workflow.
  # A production pattern would use a Lambda-backed Custom Resource or
  # aws s3 cp in the GitHub Actions workflow (see deploy-stack1.yml).

# =============================================================================
# OUTPUTS — values CloudFormation shows you after a successful deploy
# These appear in the AWS Console under "Outputs" tab of your stack.
# You can also query them with: aws cloudformation describe-stacks
# =============================================================================
Outputs:

  # The live website URL — click this after deploying to see your site!
  WebsiteURL:
    Description: >
      Your live static website URL. Open this in a browser after uploading
      index.html to see your site. Share this link with anyone!
    Value: !GetAtt WebsiteBucket.WebsiteURL
    #      ^^^^^^^^
    # !GetAtt reads an ATTRIBUTE of a resource (not just its ID).
    # WebsiteBucket.WebsiteURL is the HTTP endpoint S3 creates for the website.
    Export:
      # Export makes this output available to OTHER CloudFormation stacks.
      # Useful when stacks need to share values (e.g., EC2 stack reads S3 URL).
      Name: !Sub "${AWS::StackName}-WebsiteURL"

  # The bucket name — useful for aws s3 cp commands
  BucketName:
    Description: >
      The S3 bucket name. Use this with 'aws s3 cp' to upload files:
        aws s3 cp index.html s3://BUCKET-NAME/index.html
    Value: !Ref WebsiteBucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"

  # S3 Console URL — direct link to the bucket in the AWS Console
  BucketConsoleURL:
    Description: Direct link to view this bucket in the AWS Console.
    Value: !Sub "https://s3.console.aws.amazon.com/s3/buckets/${WebsiteBucket}?region=${AWS::Region}"

  # A reminder of how to upload a file to the bucket
  UploadCommand:
    Description: >
      Run this command to upload the sample index.html to your bucket.
    Value: !Sub "aws s3 cp infra/01-storage/index.html s3://${WebsiteBucket}/index.html"
